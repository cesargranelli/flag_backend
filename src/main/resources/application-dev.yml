spring:
  datasource:
    # Dev usa o PostgreSQL local (mesmo acesso do perfil local) — o RDS de
    # produção não fica exposto na rede de desenvolvimento.
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  firestore:
    # Perfil dev usa o FIRESTORE REAL do projeto flag-platform (default database "(default)").
    # Sem FIRESTORE_EMULATOR_HOST, o FirestoreFactory resolve credenciais via
    # FIREBASE_SERVICE_ACCOUNT (caminho do JSON), GOOGLE_APPLICATION_CREDENTIALS ou ADC.
    # Emulador é OPCIONAL: exporte FIRESTORE_EMULATOR_HOST (ex.: localhost:9090) antes de subir.
    # A persistência é DUAL no dev: PostgreSQL local (fonte de verdade) + espelho Firestore
    # nos domínios migrados (ADR-006), com flags por domínio abaixo.
    enabled: ${FIRESTORE_ENABLED:true}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
    # Domínio piloto do ADR-006 (issue #7): organizações espelham no Firestore
    # (persistência dual) quando a flag está true — default ON no perfil dev.
    organization: ${FIRESTORE_ORGANIZATION_ENABLED:true}
    # Issue #8: venues espelham no Firestore (persistência dual) quando true —
    # default ON no perfil dev.
    venue: ${FIRESTORE_VENUE_ENABLED:true}
    # Issue #9: campeonatos espelham no Firestore (persistência dual) quando true —
    # default ON no perfil dev.
    competition: ${FIRESTORE_COMPETITION_ENABLED:true}
    # Issue #10: conferências espelham no Firestore (persistência dual) quando true —
    # default ON no perfil dev.
    conference: ${FIRESTORE_CONFERENCE_ENABLED:true}
    # Issue #10: divisões espelham no Firestore (persistência dual) quando true —
    # default ON no perfil dev.
    division: ${FIRESTORE_DIVISION_ENABLED:true}

logging:
  level:
    br.com.flagplatform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
