spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  firestore:
    # Perfil local permanece somente PostgreSQL — Firestore desligado (flag false).
    # A factory só é ativada quando app.firestore.enabled=true.
    enabled: ${FIRESTORE_ENABLED:false}
    # Domínio organization também OFF no perfil local (padrão = sem espelho).
    organization: ${FIRESTORE_ORGANIZATION_ENABLED:false}
    # Domínio venue também OFF no perfil local (padrão = sem espelho).
    venue: ${FIRESTORE_VENUE_ENABLED:false}
    # Domínio competition também OFF no perfil local (padrão = sem espelho).
    competition: ${FIRESTORE_COMPETITION_ENABLED:false}

logging:
  level:
    br.com.flagplatform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
