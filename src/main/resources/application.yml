spring:
  application:
    name: flag-platform

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

  datasource:
    url: jdbc:postgresql://localhost:5432/flagplatform
    username: flagplatform
    password: flagplatform
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: platform
        format_sql: true

  flyway:
    enabled: true
    schemas:
      - platform
    locations:
      - classpath:db/migration
    default-schema: platform

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Origens adicionais liberadas no CORS (ex.: frontends publicados),
# separadas por vírgula. Localhost/127.0.0.1 em qualquer porta já são
# liberados por padrão para o dev server do Flutter Web.
app:
  cors:
    allowed-origins:
  jwt:
    # Em produção, definir via variável de ambiente JWT_SECRET (mín. 32 bytes).
    secret: ${JWT_SECRET:flag-platform-development-secret-change-me-now}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  security:
    rate-limit:
      # Anti brute-force no login: máx. tentativas por IP na janela.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_WINDOW_SECONDS:300}
    password-reset:
      # Validade do token de redefinição de senha.
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}

  mail:
    # SMTP ainda não configurado. Quando true, o token de redefinição é enviado
    # por e-mail; quando false (dev), o token é retornado na resposta.
    enabled: ${MAIL_ENABLED:false}

  firestore:
    # Habilita o Firestore (Admin SDK) no backend — persistência dual com PostgreSQL.
    # Default false: o backend continua 100% PostgreSQL/JPA. Liga por ambiente com
    # FIRESTORE_ENABLED=true (o perfil dev já defaulta true + emulador).
    enabled: ${FIRESTORE_ENABLED:false}
    # Host do emulador local no formato host:porta (sem esquema). Vazio integra com a
    # API real do Firebase (prod). Default do perfil dev: localhost:9090 (evita conflito
    # com o backend em 8080) — ver application-dev.yml.
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
    # Project ID do Firebase. Usado pelo emulador e exigido quando não há service account.
    project-id: ${FIREBASE_PROJECT_ID:flag-platform}
    # ── Flags por domínio (default false) ─────────────────────────────────────
    # Cada domínio migra ligando a própria flag (ADR-006) — ligar somente quando
    # app.firestore.enabled=true (bean Firestore ativo via FirestoreFactory).
    # Issue #7 (piloto): organização espelha no Firestore quando true.
    organization: ${FIRESTORE_ORGANIZATION_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    br.com.flagplatform: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
